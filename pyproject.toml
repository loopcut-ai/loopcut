[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcut"
version = "0.2.1"
description = "Loopcut's cloud tools for Claude Code, Codex and other agents: render .blend files on cloud GPUs, search free assets, make 3D models, sound effects and voice lines, billed to your Loopcut credits."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []
keywords = ["blender", "render", "mcp", "cloud", "loopcut", "3d", "assets"]

[project.urls]
Homepage = "https://loopcut.org/render"
Documentation = "https://loopcut.org/docs/render"
Source = "https://github.com/loopcut-ai/loopcut"

[project.scripts]
loopcut = "loopcut.cli:main"

[tool.setuptools.package-data]
loopcut = ["catalog.json", "agent_tools.json", "addon/VENDORED.md"]
