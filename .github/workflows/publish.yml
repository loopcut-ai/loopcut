# Release: bump the version in pyproject.toml, src/loopcut_render/__init__.py, .claude-plugin/*.json
# and server.json (tests/test_versions.py checks they agree), then push a tag vX.Y.Z. This publishes to PyPI with
# trusted publishing (the "pypi" environment) and then lists the release in the MCP registry.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" <<'PY'
          import json, re, sys, tomllib
          tag = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "__init__.py": re.search(r'__version__ = "([^"]+)"', open("src/loopcut_render/__init__.py").read()).group(1),
              "plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              "marketplace.json": json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"],
              "server.json": json.load(open("server.json"))["version"],
              "server.json package": json.load(open("server.json"))["packages"][0]["version"],
          }
          wrong = {k: v for k, v in found.items() if v != tag}
          if wrong:
              sys.exit(f"Tag v{tag} does not match: {wrong}")
          PY
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: uv run --no-project python -m unittest discover -s tests
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait for PyPI to serve the release
        run: |
          for _ in $(seq 30); do
            curl -fs "https://pypi.org/pypi/loopcut-render/${GITHUB_REF_NAME#v}/json" > /dev/null && exit 0
            sleep 10
          done
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
